<div class="flex min-h-screen">
  <aside class="flex w-64 shrink-0 flex-col bg-slate-900 text-slate-100">
    <div class="border-b border-slate-700 p-5">
      <span class="text-xl font-bold text-emerald-400">ColmadoX</span>
      <p class="mt-1 text-xs text-slate-400">Sistema de gestión de colmado</p>
    </div>

    <nav class="flex-1 space-y-1 p-3">
      @for (item of nav(); track item.path) {
        <a
          [routerLink]="'/' + item.path"
          routerLinkActive="bg-emerald-600 text-white"
          class="block rounded-lg px-4 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-slate-700 p-4">
      <p class="text-xs text-slate-400">Conectado como</p>
      <p class="truncate text-sm font-semibold">
        {{ perfil()?.nombre ?? '…' }}
        <span class="ml-1 rounded bg-slate-700 px-1.5 py-0.5 text-xs uppercase">
          {{ perfil()?.rol ?? '' }}
        </span>
      </p>
      <button
        (click)="salir()"
        class="mt-3 w-full rounded-lg bg-slate-700 px-3 py-1.5 text-sm font-medium transition hover:bg-slate-600"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-auto p-6">
    <router-outlet />
  </main>
</div>
