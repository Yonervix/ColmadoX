<div class="space-y-6">
  <h1 class="text-2xl font-bold">Inicio</h1>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
    @for (card of ['Ventas de hoy', 'En caja', 'Deudores', 'Stock bajo']; track card) {
      <div class="rounded-xl bg-white p-5 shadow-sm">
        <p class="text-sm text-slate-500">{{ card }}</p>
        <p class="mt-2 text-2xl font-bold">—</p>
      </div>
    }
  </div>
  <div class="rounded-xl bg-white p-10 text-center shadow-sm">
    <p class="text-slate-500">El panel principal se construirá cuando existan los datos.</p>
  </div>
</div>
