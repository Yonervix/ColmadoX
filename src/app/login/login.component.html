<div class="flex min-h-screen items-center justify-center bg-slate-900 p-4">
  <form
    (ngSubmit)="entrar()"
    class="w-full max-w-sm space-y-4 rounded-2xl bg-white p-8 shadow-xl"
  >
    <div class="text-center">
      <h1 class="text-2xl font-bold text-emerald-600">ColmadoX</h1>
      <p class="mt-1 text-sm text-slate-500">Inicia sesión para vender</p>
    </div>

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ error() }}</p>
    }

    <div>
      <label class="block text-sm font-medium text-slate-700" for="email">Correo</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        placeholder="jefe@colmadox.com"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
        placeholder="••••••••"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-500 focus:outline-none"
      />
    </div>

    <button
      type="submit"
      [disabled]="cargando()"
      class="w-full rounded-lg bg-emerald-600 py-2.5 font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-50"
    >
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
